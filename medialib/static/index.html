<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='4' width='22' height='16' rx='4' fill='%23ff0033'/%3E%3Cpath d='M10 8.5v7l6-3.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menu-btn" title="Menu" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a href="#/videos" class="logo" title="Videos">
        <svg viewBox="0 0 24 24" class="logo-mark"><rect x="1" y="4" width="22" height="16" rx="4"/><path d="M10 8.5v7l6-3.5z"/></svg>
        <span>Library</span>
      </a>
    </div>
    <div class="search" id="search">
      <div class="search-box">
        <div class="search-chips" id="search-chips"></div>
        <input id="search-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search names, folders and tags… (# for tags, - to exclude)">
        <button class="search-clear" id="search-clear" title="Clear" aria-label="Clear search">&times;</button>
      </div>
      <button class="search-btn" id="search-btn" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>
      <div class="suggest" id="search-suggest" hidden></div>
    </div>
    <div class="topbar-right">
      <span class="scan-status" id="scan-status" hidden></span>
      <button class="icon-btn" id="rescan-btn" title="Rescan library">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="Toggle light/dark">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <a href="#/videos" data-nav="videos"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/></svg><span>Videos</span></a>
      <a href="#/gallery" data-nav="gallery"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span>Gallery</span></a>
      <a href="#/continue" data-nav="continue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>Continue watching</span></a>
      <a href="#/tags" data-nav="tags"><svg viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Manage tags</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Library folders</span></a>
      <div class="sidebar-section">
        <div class="sidebar-title">Tags <input id="tag-filter" type="search" placeholder="filter"></div>
        <div class="tag-list" id="tag-list"></div>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="bulkbar" id="bulkbar" hidden>
    <span id="bulk-count"></span>
    <div class="bulk-tagger" id="bulk-tagger"></div>
    <button class="btn" id="bulk-add">Add tag</button>
    <button class="btn" id="bulk-remove">Remove tag</button>
    <button class="btn ghost" id="bulk-all">Select all loaded</button>
    <button class="btn ghost" id="bulk-clear">Done</button>
  </div>

  <div class="lightbox" id="lightbox" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
